<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Editor — Detail, Sections, Brushes</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f7f7f5; color: #1c1c1e;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  section {
    background: #fff; border: 1px solid #e3e3e0; border-radius: 14px;
    padding: 18px 20px;
  }
  h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  label { display: block; font-size: 13px; color: #55554f; margin: 10px 0 4px; }
  input[type="range"] { width: 100%; accent-color: #1c1c1e; }
  input[type="number"] {
    width: 90px; padding: 6px 8px; font-size: 14px;
    border: 1px solid #d8d8d3; border-radius: 8px;
  }
  button {
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
    background: #1c1c1e; color: #fff; border: 0; border-radius: 999px;
  }
  button.ghost { background: #fff; color: #1c1c1e; border: 1px solid #d8d8d3; }
  button.ghost[aria-pressed="true"] { background: #1c1c1e; color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .value { font-size: 13px; color: #55554f; font-variant-numeric: tabular-nums; }
  .status { font-size: 13px; color: #55554f; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<main>

  <section aria-label="Detail">
    <h2>Detail</h2>
    <label for="triSlider">Triangles</label>
    <input type="range" id="triSlider" min="100" max="1280" step="10" value="1280">
    <div class="row">
      <span class="value" id="triValue">1,280</span>
      <button type="button" id="moreDetailed">More detailed</button>
    </div>
  </section>

  <section aria-label="Sections">
    <h2>Sections</h2>
    <div class="row">
      <label for="sectionCount" style="margin:0">Sections</label>
      <input type="number" id="sectionCount" min="1" max="64" value="6">
      <button type="button" id="runSections">Run</button>
    </div>
    <div class="status" id="stitchStatus">Stitch: —</div>
  </section>

  <section aria-label="Brushes">
    <h2>Brushes</h2>
    <div class="row" role="group" aria-label="Brush mode">
      <button type="button" class="ghost" data-mode="paint" aria-pressed="true">Paint</button>
      <button type="button" class="ghost" data-mode="erase" aria-pressed="false">Erase</button>
      <button type="button" class="ghost" data-mode="sculpt" aria-pressed="false">Sculpt</button>
    </div>
    <label for="brushSize">Size</label>
    <input type="range" id="brushSize" min="0.05" max="2" step="0.05" value="0.5">
    <label for="brushHardness">Hardness</label>
    <input type="range" id="brushHardness" min="0" max="1" step="0.05" value="0.35">
    <div id="strengthRow">
      <label for="brushStrength">Strength</label>
      <input type="range" id="brushStrength" min="0" max="1" step="0.05" value="0.3">
    </div>
  </section>

</main>
<script>
  const slider = document.getElementById("triSlider");
  const triValue = document.getElementById("triValue");
  const showCount = () => {
    triValue.textContent = Number(slider.value).toLocaleString("en-US");
  };
  slider.addEventListener("input", showCount);
  showCount();

  document.getElementById("moreDetailed").addEventListener("click", () => {
    slider.max = Math.ceil(Number(slider.max) * 1.5 / 10) * 10;
    slider.value = slider.max;
    showCount();
  });

  document.getElementById("runSections").addEventListener("click", () => {
    document.getElementById("stitchStatus").textContent = "Stitch: running";
  });

  const strengthRow = document.getElementById("strengthRow");
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-mode]").forEach((b) =>
        b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      strengthRow.style.display = btn.dataset.mode === "sculpt" ? "" : "none";
    });
  });
  strengthRow.style.display = "none";
</script>
</body>
</html>
